<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A Jornada do Bit, um jogo educativo sobre a evolucao dos dispositivos de armazenamento."
    />
    <title>A Jornada do Bit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <main class="game-shell" aria-label="Jogo A Jornada do Bit">
